<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTROLE & OVERLAY MOTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-controle: #111318;
    --card-bg: #1a1d24;
    --verde: #4ade80;
    --amarelo: #fbbf24;
    --vermelho: #ef4444;
    --azul: #3b82f6;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Chakra Petch', sans-serif;
    background: var(--bg-controle);
    color: #fff;
    min-height: 100vh;
  }

  body.modo-obs {
    background: transparent !important;
    min-height: auto;
    overflow: hidden;
  }

  body.modo-obs .painel-controle,
  body.modo-obs .preview-label,
  body.modo-obs .status-bar {
    display: none !important;
  }

  .container-geral {
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 14px 36px;
  }

  body.modo-obs .container-geral {
    max-width: 100%;
    padding: 6px;
    margin: 0;
  }

  .preview-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #9ca3af;
    margin-bottom: 8px;
    text-align: center;
  }

  .overlay-box {
    position: relative;
    background: rgba(14, 16, 20, 0.86);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    padding: 14px 16px 14px 128px;
    min-height: 138px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    overflow: visible;
  }

  body.modo-obs .overlay-box {
    background: rgba(12, 14, 18, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .moto-cena {
    position: absolute;
    left: 10px;
    bottom: 10px;
    width: 108px;
    height: 92px;
    pointer-events: none;
  }

  .chao-linha {
    position: absolute;
    left: 4px;
    right: 2px;
    bottom: 4px;
    height: 3px;
    background: repeating-linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.35) 0px,
      rgba(255, 255, 255, 0.35) 10px,
      transparent 10px,
      transparent 18px
    );
    animation: asfaltoMover 0.45s linear infinite;
  }

  @keyframes asfaltoMover {
    from { background-position: 0 0; }
    to { background-position: -36px 0; }
  }

  .moto-grupo {
    position: absolute;
    left: 24px;
    bottom: 7px;
    width: 76px;
    height: 62px;
    transform-origin: center bottom;
    animation: motoVibrar 0.14s ease-in-out infinite alternate, motoSuspensao 1.1s ease-in-out infinite;
  }

  @keyframes motoVibrar {
    0% { transform: translateY(0px) rotate(0deg); }
    100% { transform: translateY(-1.8px) rotate(-0.7deg); }
  }

  @keyframes motoSuspensao {
    0%, 100% { margin-bottom: 0px; }
    50% { margin-bottom: 2.5px; }
  }

  .roda {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 4px solid #d1d5db;
    background: #18181b;
    box-shadow: inset 0 0 0 2px #3f3f46;
    animation: girarRoda 0.28s linear infinite;
  }

  .roda::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border-top: 2px solid #9ca3af;
    border-bottom: 2px solid transparent;
  }

  .roda-traseira { left: 4px; }
  .roda-dianteira { right: 4px; }

  @keyframes girarRoda {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .cano-escape {
    position: absolute;
    left: 2px;
    bottom: 13px;
    width: 22px;
    height: 6px;
    background: linear-gradient(90deg, #52525b, #a1a1aa);
    border-radius: 2px 0 0 2px;
    transform: rotate(-8deg);
  }

  .corpo-moto {
    position: absolute;
    left: 14px;
    bottom: 12px;
    width: 48px;
    height: 28px;
  }

  .carenagem {
    position: absolute;
    left: 6px;
    bottom: 6px;
    width: 36px;
    height: 15px;
    background: #dc2626;
    border-radius: 8px 14px 4px 6px;
    border: 2px solid #7f1d1d;
  }

  .banco {
    position: absolute;
    left: 8px;
    bottom: 20px;
    width: 20px;
    height: 6px;
    background: #27272a;
    border-radius: 4px 6px 0 0;
    transform: rotate(-6deg);
  }

  .guidao-farol {
    position: absolute;
    right: 6px;
    bottom: 18px;
    width: 10px;
    height: 14px;
    border-right: 3px solid #e4e4e7;
    border-top: 3px solid #e4e4e7;
    border-radius: 0 5px 0 0;
    transform: rotate(12deg);
  }

  .farol-luz {
    position: absolute;
    right: -1px;
    bottom: 22px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fef08a;
    box-shadow: 0 0 8px #fde047;
  }

  .piloto {
    position: absolute;
    left: 18px;
    bottom: 25px;
    width: 22px;
    height: 26px;
  }

  .capacete {
    position: absolute;
    top: 0;
    left: 4px;
    width: 15px;
    height: 14px;
    border-radius: 8px 9px 6px 6px;
    background: #f8fafc;
    border: 2px solid #1e293b;
  }

  .viseira {
    position: absolute;
    top: 4px;
    right: 1px;
    width: 6px;
    height: 5px;
    background: #0f172a;
    border-radius: 1px 4px 4px 1px;
  }

  .jaqueta {
    position: absolute;
    bottom: 0;
    left: 3px;
    width: 14px;
    height: 12px;
    background: #2563eb;
    border-radius: 4px 6px 2px 2px;
  }

  .fumaca {
    position: absolute;
    left: 16px;
    bottom: 20px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.72);
    filter: blur(0.6px);
    opacity: 0;
    animation: puffEscape 1.35s ease-out infinite;
  }

  .fumaca.f2 { animation-delay: 0.45s; }
  .fumaca.f3 { animation-delay: 0.9s; }

  @keyframes puffEscape {
    0% {
      opacity: 0.75;
      transform: translate(0, 0) scale(0.45);
    }
    50% {
      opacity: 0.45;
      transform: translate(-14px, -9px) scale(0.95);
    }
    100% {
      opacity: 0;
      transform: translate(-28px, -18px) scale(1.45);
    }
  }

  .titulo-saldo {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #93c5fd;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-shadow: 2px 2px 0 #000;
  }

  .valor-principal {
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    color: #fef08a;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #000, 0 0 12px rgba(250, 204, 21, 0.25);
    word-break: break-word;
  }

  .meta-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #86efac;
    text-shadow: 1px 1px 0 #000;
  }

  .barra-meta-bg {
    flex: 1;
    height: 10px;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .barra-meta-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #a3e635);
    transition: width 0.35s ease;
  }

  .entregas-texto {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #fb923c;
    text-shadow: 2px 2px 0 #000;
  }

  .painel-controle {
    margin-top: 20px;
    background: var(--card-bg);
    border-radius: 14px;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .painel-controle h1 {
    font-size: 20px;
    text-align: center;
    color: var(--verde);
    margin-bottom: 14px;
  }

  .linha-meta-config {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #12151b;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
  }

  .btn-meta {
    width: auto;
    padding: 8px 12px;
    margin: 0;
    font-size: 13px;
    background: #374151;
    border-radius: 6px;
  }

  input {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    text-align: center;
    border: none;
    border-radius: 8px;
    background: #282d3a;
    color: #fff;
    margin-bottom: 12px;
    font-family: 'Chakra Petch', sans-serif;
  }

  button {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    margin: 6px 0;
    cursor: pointer;
    color: #fff;
    font-family: 'Chakra Petch', sans-serif;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-add { background: #16a34a; }
  .btn-sub { background: #dc2626; }
  .btn-zero { background: #2563eb; }

  .status-bar {
    text-align: center;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }

  .ok {
    background: #143322;
    color: #86efac;
    display: block !important;
  }

  .erro {
    background: #361616;
    color: #fca5a5;
    display: block !important;
  }

  .dica-obs {
    margin-top: 14px;
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.45;
    background: #12151b;
    padding: 10px 12px;
    border-radius: 8px;
  }

  .dica-obs code {
    color: #fde047;
  }
</style>
</head>
<body>
  <div class="container-geral">
    <div class="preview-label">Preview da Fonte (OBS)</div>

    <div class="overlay-box">
      <div class="moto-cena" aria-hidden="true">
        <div class="fumaca"></div>
        <div class="fumaca f2"></div>
        <div class="fumaca f3"></div>

        <div class="moto-grupo">
          <div class="cano-escape"></div>
          <div class="corpo-moto">
            <div class="carenagem"></div>
            <div class="banco"></div>
            <div class="guidao-farol"></div>
            <div class="farol-luz"></div>
          </div>
          <div class="piloto">
            <div class="capacete">
              <div class="viseira"></div>
            </div>
            <div class="jaqueta"></div>
          </div>
          <div class="roda roda-traseira"></div>
          <div class="roda roda-dianteira"></div>
        </div>

        <div class="chao-linha"></div>
      </div>

      <div class="titulo-saldo">SALDO DO DIA</div>
      <div class="valor-principal" id="v">R$ 0,00</div>

      <div class="meta-linha">
        <span id="meta-label">META: R$ 200,00</span>
        <div class="barra-meta-bg">
          <div class="barra-meta-fill" id="barra-meta"></div>
        </div>
        <span id="meta-pct">0%</span>
      </div>

      <div class="entregas-texto" id="e">ENTREGAS: 0</div>
    </div>

    <div class="painel-controle">
      <h1>🏍️ CONTROLE DA LIVE</h1>

      <div class="linha-meta-config">
        <span id="meta-resumo">Meta do dia: <strong>R$ 200,00</strong></span>
        <button type="button" class="btn-meta" onclick="alterarMeta()">Alterar Meta</button>
      </div>

      <input type="text" inputmode="decimal" id="campo" placeholder="Valor da entrega (ex: 8,50)">

      <button type="button" class="btn-add" onclick="enviar('adicionar')">➕ ADICIONAR 🔔</button>
      <button type="button" class="btn-sub" onclick="enviar('subtrair')">➖ SUBTRAIR</button>
      <button type="button" class="btn-zero" onclick="zerar()">🔄 ZERAR TUDO</button>

      <div id="status" class="status-bar"></div>

      <div class="dica-obs">
        <strong>Fonte no OBS:</strong> adicione uma fonte de <em>Navegador</em> apontando para este arquivo com <code>?modo=obs</code> no final para exibir apenas a tela com a moto animada.
      </div>
    </div>
  </div>

<script>
const LINK = 'https://script.google.com/macros/s/AKfycbz68FSijiihhof5kqq_Vntqwmw3shI0WX5jyE9aiZWQQQmc05UJW21CTjFajC4mF-o1jQ/exec';

const params = new URLSearchParams(window.location.search);
if (params.get('modo') === 'obs') {
  document.body.classList.add('modo-obs');
}

let metaDia = parseFloat(localStorage.getItem('meta_live_moto') || '200');
if (isNaN(metaDia) || metaDia <= 0) metaDia = 200;

let saldoAtual = 0;

function formatarMoeda(num) {
  return 'R$ ' + Number(num || 0).toFixed(2).replace('.', ',');
}

function renderizarMeta() {
  document.getElementById('meta-label').textContent = 'META: ' + formatarMoeda(metaDia);
  document.getElementById('meta-resumo').innerHTML = 'Meta do dia: <strong>' + formatarMoeda(metaDia) + '</strong>';
  const pct = Math.max(0, Math.min(100, Math.round((saldoAtual / metaDia) * 100)));
  document.getElementById('barra-meta').style.width = pct + '%';
  document.getElementById('meta-pct').textContent = pct + '%';
}

function travarBotoes(estado) {
  document.querySelectorAll('.painel-controle button').forEach(b => { b.disabled = estado; });
}

function aplicarDadosNaTela(d) {
  saldoAtual = Number(d && d.valor ? d.valor : 0);
  const entregas = Number(d && d.entregas ? d.entregas : 0);
  document.getElementById('v').textContent = formatarMoeda(saldoAtual);
  document.getElementById('e').textContent = 'ENTREGAS: ' + entregas;
  renderizarMeta();
  statusMsg('ok', '🟢 Conectado!');
}

function carregarViaJsonp(urlBase) {
  return new Promise((resolve, reject) => {
    const nomeCallback = 'cbOverlayMoto_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const scriptTag = document.createElement('script');
    const sep = urlBase.includes('?') ? '&' : '?';

    const timer = setTimeout(() => {
      limpar();
      reject(new Error('Timeout JSONP'));
    }, 6000);

    function limpar() {
      clearTimeout(timer);
      if (scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
      try { delete window[nomeCallback]; } catch { window[nomeCallback] = undefined; }
    }

    window[nomeCallback] = function(dados) {
      limpar();
      resolve(dados);
    };

    scriptTag.onerror = function() {
      limpar();
      reject(new Error('Erro ao carregar script JSONP'));
    };

    scriptTag.src = `${urlBase}${sep}callback=${nomeCallback}&t=${Date.now()}`;
    document.body.appendChild(scriptTag);
  });
}

async function atualizarTela() {
  try {
    const sep = LINK.includes('?') ? '&' : '?';
    const urlConsulta = `${LINK}${sep}t=${Date.now()}`;
    const r = await fetch(urlConsulta, {
      cache: 'no-store',
      redirect: 'follow'
    });
    const d = await r.json();
    aplicarDadosNaTela(d);
  } catch {
    try {
      const dadosJsonp = await carregarViaJsonp(LINK);
      aplicarDadosNaTela(dadosJsonp);
    } catch {
      statusMsg('erro', '⚠️ Sem conexão - tentando novamente...');
    }
  }
}

async function enviar(acao) {
  const raw = document.getElementById('campo').value.replace(',', '.').trim();
  const val = parseFloat(raw);
  if (isNaN(val) || val <= 0) {
    statusMsg('erro', 'Digite um valor válido!');
    return;
  }
  travarBotoes(true);
  try {
    const url = acao === 'subtrair'
      ? `${LINK}?valor=${val}&acao=subtrair`
      : `${LINK}?valor=${val}`;

    await fetch(url, { mode: 'no-cors', redirect: 'follow' });
    document.getElementById('campo').value = '';
    setTimeout(atualizarTela, 1500);
    statusMsg('ok', acao === 'subtrair'
      ? `✅ Subtraído: ${formatarMoeda(val)}`
      : `✅ Adicionado: ${formatarMoeda(val)}`);
  } catch {
    statusMsg('erro', '❌ Erro ao enviar');
  } finally {
    travarBotoes(false);
  }
}

async function zerar() {
  if (!confirm('Zerar tudo?')) return;
  travarBotoes(true);
  try {
    await fetch(`${LINK}?acao=zerar`, { mode: 'no-cors', redirect: 'follow' });
    setTimeout(atualizarTela, 1500);
    statusMsg('ok', '✅ ZERADO!');
  } catch {
    statusMsg('erro', '❌ Erro ao zerar');
  } finally {
    travarBotoes(false);
  }
}

function alterarMeta() {
  const entrada = prompt('Digite a nova meta do dia (ex: 250 ou 250,00):', String(metaDia).replace('.', ','));
  if (!entrada) return;
  const parsed = parseFloat(entrada.replace(',', '.').trim());
  if (isNaN(parsed) || parsed <= 0) {
    statusMsg('erro', 'Meta inválida!');
    return;
  }
  metaDia = parsed;
  localStorage.setItem('meta_live_moto', String(metaDia));
  renderizarMeta();
  statusMsg('ok', `🎯 Meta atualizada para ${formatarMoeda(metaDia)}`);
}

function statusMsg(tipo, texto) {
  const s = document.getElementById('status');
  s.className = 'status-bar ' + tipo;
  s.textContent = texto;
  clearTimeout(window.t);
  window.t = setTimeout(() => { s.style.display = 'none'; }, 3000);
}

renderizarMeta();
atualizarTela();
setInterval(atualizarTela, 4000);
</script>
</body>
</html>
